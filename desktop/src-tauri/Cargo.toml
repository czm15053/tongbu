[package]
name = "desktop"
version = "0.1.0"
description = "tongbu 桌面壳 — 输入会话 ID，复制各 agent resume 命令"
authors = ["czm"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-clipboard-manager = "2.3.2"
